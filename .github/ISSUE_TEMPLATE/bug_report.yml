name: Bug report
description: Something in Trove doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you running Trove?
      options:
        - Hosted (mytrove.in)
        - Self-hosted
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent or MCP client
      placeholder: Claude Code, Codex, Cursor, claude.ai
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove any keys, tokens or connection strings first.
      render: shell
