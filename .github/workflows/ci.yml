name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-memory:
    name: test (memory driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (node:test, memory store)
        run: TROVE_STORE=memory npm test
        env:
          DATABASE_URL: ""

  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: trove
          POSTGRES_PASSWORD: trove
          POSTGRES_DB: trove
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trove"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://trove:trove@localhost:5432/trove

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema and migrations
        run: npm run db:schema && npm run db:migrate

      - name: Test (node:test, against Postgres)
        run: npm test

      - name: Build web dashboard
        run: npm run web:build
