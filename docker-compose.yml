services:
  app:
    build: .
    profiles:
      - app
    environment:
      PORT: 8787
      DATABASE_URL: postgres://trove:trove@postgres:5432/trove
      TROVE_SERVICE_TOKENS: ${TROVE_SERVICE_TOKENS:-local-dev-token|local-agent|graph:admin}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: trove
      POSTGRES_PASSWORD: trove
      POSTGRES_DB: trove
    ports:
      # Host port 5433: 5432 is commonly taken by another local Postgres (e.g. space-db).
      - "${TROVE_PG_PORT:-5433}:5432"
    volumes:
      - trove-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trove -d trove"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  trove-postgres:
